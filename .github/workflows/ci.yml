name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trust-checks:
    name: trust checks (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      ANTEMORTEM_ENABLE_LIVE_PROVIDER_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -q
      - name: Check repository consistency
        run: python scripts/check_repo_consistency.py
      - name: Check generated README claims
        run: python scripts/generate_readme_claims.py --check
      - name: Check public claim ledger
        run: python scripts/check_claim_ledger.py
      - name: Run offline golden benchmark
        # Absolute-invariant floors (must always hold):
        #   high_severity_block_rate=1.0  GOLDEN-CONSISTENCY check: every case the
        #     detector flags high-sev must carry a DO_NOT_PROCEED stored decision. The
        #     detector mirrors the live gate (_reals + _severity + _remediation) so it
        #     can't drift from the gate's high-sev set. NOTE: this does NOT guard the
        #     _severity code path -- the detector uses live _severity but the decision
        #     is read from the stored golden, so a regression (omitted->medium) drops
        #     the omitted-severity case out of the DENOMINATOR, not the numerator, and
        #     the rate stays 1.0 (verified). Omitted-severity BLOCKING is guaranteed by
        #     the gate unit test (test_missing_severity_unmitigated_real_blocks, which
        #     recomputes compute_decision), not this floor.
        #     (citation_range_too_large carries an explicit non-high severity so its
        #     citation test is not masked by the high-sev precedence.)
        #   citation_valid_rate is NOT floored at 1.0 -- the golden gallery ships
        #     adversarial invalid-citation cases by design (fabricated / traversal /
        #     symlink / out-of-range / wrong-snippet), so its measured value is
        #     ~0.643; it is ratcheted at its current floor instead.
        # Ratchet floors (re-baseline only after a verified golden improvement):
        #   decision_accuracy=1.0, trap_label_accuracy=1.0 (currently perfect),
        #   citation_valid_rate=0.64 (measured 0.643, rounded DOWN to stay above
        #     float noise; --fail-under fires on metric < value).
        # Ratchet CEILING (low is good here, so a floor would fire backwards):
        #   false_ghost_rate=0.0 via --fail-over (fires on metric > value); measured
        #   0.0, so any regression that fabricates a ghost trips CI.
        run: >-
          antemortem eval benchmarks/golden_cases --json
          --fail-under high_severity_block_rate=1.0
          --fail-under decision_accuracy=1.0
          --fail-under trap_label_accuracy=1.0
          --fail-under citation_valid_rate=0.64
          --fail-over false_ghost_rate=0.0
          > benchmark-results.json
      - name: Upload offline benchmark JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}-py${{ matrix.python-version }}
          path: benchmark-results.json
          if-no-files-found: warn
      - name: Clean dist
        run: python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*

  wheel-smoke:
    name: wheel smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      ANTEMORTEM_ENABLE_LIVE_PROVIDER_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Smoke-test installed wheel
        run: python scripts/smoke_wheel_install.py

  omega-lock-citation-drift:
    # Tier B docking hardlock: verify the README omega-lock citations against a
    # PINNED omega-lock checkout (immutable SHA = v0.3.2). Isolated in its own
    # job so a checkout/network hiccup reds ONLY this signal, never the core
    # trust-checks gate. The SHA is immutable, so this is PR-safe (it reds only
    # when a citation genuinely drifts -- the exact pre-merge catch we want).
    # A CI-time checkout is NOT a runtime dependency: antemortem keeps zero
    # `import omega_lock`.
    name: omega-lock citation drift (Tier B docking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      ANTEMORTEM_ENABLE_LIVE_PROVIDER_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Pin omega-lock @ v0.3.2 (immutable SHA; CI-time checkout only)
        uses: actions/checkout@v4
        with:
          repository: hibou04-ops/omega-lock
          ref: 9989ee929a5ed382cfb592502d1279dc6b5dc31d
          path: _omega_lock_pin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify omega-lock citations against pinned v0.3.2
        run: python scripts/check_omega_lock_citations.py --omega-lock-root _omega_lock_pin
