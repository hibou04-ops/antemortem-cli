name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish antemortem
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade build twine

      - name: Verify version
        # Version-agnostic: read the package version from pyproject (single
        # source of truth), assert __init__ matches it, and — on a release
        # event — assert the git tag matches too. No per-release edits here.
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version: $PKG_VERSION"
          python - "$PKG_VERSION" <<'PY'
          import re, sys
          want = sys.argv[1]
          text = open("src/antemortem/__init__.py", encoding="utf-8").read()
          m = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          got = m.group(1) if m else None
          assert got == want, f"__init__ __version__ {got!r} != pyproject {want!r}"
          print(f"__init__ __version__: {got}")
          PY
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
            echo "release tag: $TAG"
            [ "$TAG" = "v$PKG_VERSION" ] || [ "$TAG" = "$PKG_VERSION" ] || {
              echo "release tag $TAG does not match package version $PKG_VERSION" >&2
              exit 1
            }
          fi

      - name: Run tests
        run: python -m pip install -e ".[dev]" && python -m pytest tests

      - name: Build package
        run: |
          rm -rf dist build *.egg-info src/*.egg-info
          python -m build

      - name: Check package
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
