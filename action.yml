# SPDX-License-Identifier: Apache-2.0
# Composite GitHub Action: run the antemortem ship gate in CI.
#
# Usage in a workflow:
#
#   - uses: hibou04-ops/antemortem-cli@v0.12.5
#     with:
#       document: antemortem/feat.md
#       repo: .
#       allow: SAFE_TO_PROCEED,PROCEED_WITH_GUARDS
#
# The default version installs this checked-out Action source. An explicitly
# different version or 'latest' retains the PyPI override. It then runs
# `antemortem gate` against the supplied document.
# The gate exits non-zero — failing the job — when lint fails or the
# recomputed decision is inconsistent or not in the allowlist, or evidence
# coverage fails. The machine-readable JSON
# summary (verdict + fabricated-citation metrics) is written to the path
# in the `summary-file` input and exposed as the `summary` output.
#
# The document must already have a companion <doc>.json run artifact
# (produced by `antemortem run`) committed or generated in an earlier
# step. The legacy `require-artifact=false` input cannot authorize missing
# evidence; use `antemortem lint` separately for schema-only checks.
name: Antemortem gate
description: Make your AI agent cite file:line for every claim, then fail the build on fabricated citations or a blocked decision.
author: hibou04-ops
branding:
  icon: shield
  color: red

inputs:
  document:
    description: Path to the antemortem document to gate (e.g. antemortem/feat.md).
    required: true
  repo:
    description: Repository root to resolve cited files against.
    required: false
    default: "."
  allow:
    description: >-
      Comma-separated decisions allowed to ship. Default:
      SAFE_TO_PROCEED,PROCEED_WITH_GUARDS.
    required: false
    default: "SAFE_TO_PROCEED,PROCEED_WITH_GUARDS"
  require-artifact:
    description: >-
      Compatibility input. Gate always rejects missing evidence; use lint
      separately for schema-only checks.
    required: false
    default: "true"
  version:
    description: >-
      The default version installs this Action's source. A different explicit
      version or 'latest' selects the existing PyPI override.
    required: false
    default: "0.12.5"
  python-version:
    description: Python version to set up.
    required: false
    default: "3.12"
  summary-file:
    description: Path to write the machine-readable gate JSON summary.
    required: false
    default: "antemortem-gate-summary.json"

outputs:
  summary:
    description: The gate JSON summary (verdict, decision, citation metrics).
    value: ${{ steps.gate.outputs.summary }}
  decision:
    description: The freshly recomputed decision value as gated.
    value: ${{ steps.gate.outputs.decision }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install antemortem
      shell: bash
      env:
        INPUT_PACKAGE_VERSION: ${{ inputs.version }}
        ACTION_SOURCE: ${{ github.action_path }}
      run: |
        if [ "$INPUT_PACKAGE_VERSION" = "0.12.5" ]; then
          python -m pip install "$ACTION_SOURCE"
        elif [ "$INPUT_PACKAGE_VERSION" = "latest" ]; then
          python -m pip install --upgrade antemortem
        else
          python -m pip install "antemortem==$INPUT_PACKAGE_VERSION"
        fi

    - name: Run antemortem gate
      id: gate
      shell: bash
      env:
        PYTHONUTF8: "1"
      run: |
        set -o pipefail
        require_flag="--require-artifact"
        if [ "${{ inputs.require-artifact }}" = "false" ]; then
          require_flag="--no-require-artifact"
        fi

        # Emit the machine-readable summary to a file (always), and let the
        # gate's own exit code fail the step on a blocked decision / bad lint.
        set +e
        antemortem gate "${{ inputs.document }}" \
          --repo "${{ inputs.repo }}" \
          --allow "${{ inputs.allow }}" \
          $require_flag \
          --format json | tee "${{ inputs.summary-file }}"
        gate_exit=${PIPESTATUS[0]}
        set -e

        # Surface the summary + decision as step outputs for downstream steps.
        {
          echo "summary<<__ANTEMORTEM_EOF__"
          cat "${{ inputs.summary-file }}"
          echo "__ANTEMORTEM_EOF__"
        } >> "$GITHUB_OUTPUT"
        decision=$(python -c "import json,sys; print(json.load(open('${{ inputs.summary-file }}')).get('decision') or '')")
        echo "decision=$decision" >> "$GITHUB_OUTPUT"

        exit $gate_exit
